{{- if .Values.ml.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "karpos.fullname" . }}-ml
  labels: {{- include "karpos.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.ml.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: ml
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: ml
        {{- include "karpos.labels" . | nindent 8 }}
    spec:
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: ml
          image: {{ include "karpos.image" (dict "image" .Values.ml.image "Values" .Values) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          ports: [{ containerPort: {{ .Values.ml.port }} }]
          readinessProbe:
            httpGet: { path: /healthz, port: {{ .Values.ml.port }} }
            periodSeconds: 10
          resources: {{- toYaml .Values.ml.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "karpos.fullname" . }}-ml
spec:
  selector:
    app.kubernetes.io/component: ml
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports: [{ port: 80, targetPort: {{ .Values.ml.port }} }]
{{- end }}
