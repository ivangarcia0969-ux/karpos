name: karpos

# Karpos baseline DB only.
# - Postgres 16 vanilla (no Timescale, no PostGIS, no pgvector).
# - Bound to 127.0.0.1:5433 so it does not collide with Supabase on 5432.
# - migrate/seed are one-shot services activated via --profile once.

services:
  postgres:
    image: postgres:16-alpine
    container_name: karpos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-karpos}
      POSTGRES_USER: ${POSTGRES_USER:-karpos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - karpos-pg:/var/lib/postgresql/data
    networks: [karpos]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-karpos} -d ${POSTGRES_DB:-karpos}"]
      interval: 10s
      timeout: 5s
      retries: 12

  migrate:
    image: node:20-alpine
    container_name: karpos-migrate
    profiles: ["once"]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-karpos}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-karpos}
    working_dir: /app
    entrypoint: ["sh", "-c", "npm install --silent postgres@3.4.4 && node /app/scripts/migrate.mjs"]
    volumes:
      - ../../scripts:/app/scripts:ro
      - ../../infra/db:/app/infra/db:ro
    networks: [karpos]

  seed:
    image: node:20-alpine
    container_name: karpos-seed
    profiles: ["once"]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-karpos}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-karpos}
    working_dir: /app
    entrypoint: ["sh", "-c", "npm install --silent postgres@3.4.4 && node /app/scripts/seed.mjs"]
    volumes:
      - ../../scripts:/app/scripts:ro
      - ../../infra/db:/app/infra/db:ro
    networks: [karpos]

volumes:
  karpos-pg:

networks:
  karpos:
    name: karpos-net
