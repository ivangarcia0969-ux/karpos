name: karpos

# Karpos prod stack — Postgres + API + Web.
# - Postgres bound to 127.0.0.1:5433 (Supabase keeps 5432).
# - API on 127.0.0.1:4100, Web on 127.0.0.1:3100. System Caddy proxies them.
# - migrate/seed are one-shot under --profile once.

services:
  postgres:
    image: postgres:16-alpine
    container_name: karpos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-karpos}
      POSTGRES_USER: ${POSTGRES_USER:-karpos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - karpos-pg:/var/lib/postgresql/data
    networks: [karpos]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-karpos} -d ${POSTGRES_DB:-karpos}"]
      interval: 10s
      timeout: 5s
      retries: 12

  migrate:
    image: node:20-alpine
    container_name: karpos-migrate
    profiles: ["once"]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-karpos}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-karpos}
    working_dir: /app
    entrypoint: ["sh", "-c", "npm install --silent postgres@3.4.4 && node /app/scripts/migrate.mjs"]
    volumes:
      - ../../scripts:/app/scripts:ro
      - ../../infra/db:/app/infra/db:ro
    networks: [karpos]

  seed:
    image: node:20-alpine
    container_name: karpos-seed
    profiles: ["once"]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-karpos}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-karpos}
    working_dir: /app
    entrypoint: ["sh", "-c", "npm install --silent postgres@3.4.4 && node /app/scripts/seed.mjs"]
    volumes:
      - ../../scripts:/app/scripts:ro
      - ../../infra/db:/app/infra/db:ro
    networks: [karpos]

  seed-demo:
    image: node:20-alpine
    container_name: karpos-seed-demo
    profiles: ["demo"]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-karpos}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-karpos}
    working_dir: /app
    entrypoint: ["sh", "-c", "npm install --silent postgres@3.4.4 bcryptjs@2.4.3 && node /app/scripts/seed-demo.mjs"]
    volumes:
      - ../../scripts:/app/scripts:ro
    networks: [karpos]

  api:
    image: karpos-api:${KARPOS_TAG:-latest}
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    container_name: karpos-api
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    ports:
      - "127.0.0.1:4100:4000"
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      API_PORT: "4000"
      API_BASE_URL: https://${PUBLIC_HOST}
      WEB_BASE_URL: https://${PUBLIC_HOST}
      DATABASE_URL: postgres://${POSTGRES_USER:-karpos}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-karpos}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      COOKIE_NAME: ${COOKIE_NAME:-karpos.session}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      COOKIE_SECURE: "true"
    networks: [karpos]

  web:
    image: karpos-web:${KARPOS_TAG:-latest}
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    container_name: karpos-web
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "127.0.0.1:3100:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: https://${PUBLIC_HOST}
      NEXT_PUBLIC_SITE_URL: https://${PUBLIC_HOST}
      KARPOS_COOKIE_NAME: ${COOKIE_NAME:-karpos.session}
      JWT_SECRET: ${JWT_SECRET}
    networks: [karpos]

volumes:
  karpos-pg:

networks:
  karpos:
    name: karpos-net
