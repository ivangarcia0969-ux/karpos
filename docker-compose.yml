name: karpos-dev

services:
  postgres:
    image: timescale/timescaledb-ha:pg16
    container_name: karpos-postgres
    environment:
      POSTGRES_DB: karpos
      POSTGRES_USER: karpos
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/home/postgres/pgdata/data
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U karpos -d karpos"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: karpos-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  nats:
    image: nats:2.10-alpine
    container_name: karpos-nats
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"

  minio:
    image: minio/minio:latest
    container_name: karpos-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: karpos
      MINIO_ROOT_PASSWORD: karpos-dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 karpos karpos-dev;
      mc mb -p local/karpos-files;
      mc mb -p local/karpos-thumbs;
      mc mb -p local/karpos-exports;
      exit 0;
      "

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: karpos-keycloak
    command: ["start-dev", "--http-port=8081", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    ports:
      - "8081:8081"

  mailhog:
    image: mailhog/mailhog:latest
    container_name: karpos-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pg_data:
  redis_data:
  minio_data:
