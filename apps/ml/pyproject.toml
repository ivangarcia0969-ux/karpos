[project]
name = "karpos-ml"
version = "0.1.0"
description = "Karpos ML services — vision, forecasting, embeddings"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.30.6",
  "pydantic==2.9.2",
  "pydantic-settings==2.5.2",
  "numpy==2.0.2",
  "pandas==2.2.2",
  "scikit-learn==1.5.2",
  "lightgbm==4.5.0",
  "prophet==1.1.5",
  "torch==2.4.1; platform_system != 'Linux' or platform_machine != 'aarch64'",
  "pillow==10.4.0",
  "httpx==0.27.2",
  "loguru==0.7.2",
  "sentence-transformers==3.1.0",
  "psycopg[binary]==3.2.2",
  "redis==5.0.8",
  "opentelemetry-api==1.27.0",
  "opentelemetry-sdk==1.27.0",
  "opentelemetry-instrumentation-fastapi==0.48b0"
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.3",
  "pytest-asyncio==0.24.0",
  "ruff==0.6.5",
  "mypy==1.11.2"
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-select = ["I", "B", "UP", "N"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
